services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
      POSTGRES_DB: metering
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d metering"]
      interval: 2s
      timeout: 3s
      retries: 20

  service:
    build: ./service
    environment:
      PORT: 3000
      DATABASE_URL: postgres://metering:metering@db:5432/metering
      ADMIN_KEY: admin-secret
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20

  client:
    build: ./client
    environment:
      SERVICE_URL: http://service:3000
      ADMIN_KEY: admin-secret
    depends_on:
      service:
        condition: service_healthy

  loadtest:
    build: ./load-test
    profiles: ["loadtest"]
    environment:
      SERVICE_URL: http://service:3000
      ADMIN_KEY: admin-secret
      DATABASE_URL: postgres://metering:metering@db:5432/metering
      LABEL: ${LABEL:-run}
      DURATION: ${DURATION:-15}
      CONNECTIONS: ${CONNECTIONS:-50}
    volumes:
      - ./load-test/results:/app/results
    depends_on:
      service:
        condition: service_healthy

volumes:
  pgdata:
